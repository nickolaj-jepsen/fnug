name: Release

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
  # Retries a failed release; registries that already have the version are skipped.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5

      # The tag is created last, so a missing tag means this version isn't fully released.
      - name: Release unless the version is already tagged
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged, nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ $? -eq 2 ]; then
            echo "Releasing v$version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not list the remote tags"
            exit 1
          fi

  ci:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    uses: ./.github/workflows/ci.yaml

  build:
    needs: ci
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: fnug-linux-x86_64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: fnug-linux-aarch64
            cross: true
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: fnug-macos-x86_64
          - runner: macos-latest
            target: aarch64-apple-darwin
            artifact: fnug-macos-aarch64
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}
          rustflags: ""

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/fnug ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  pypi-build:
    needs: ci
    name: PyPI Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: manylinux_2_28
            smoke: true
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: manylinux_2_28
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            smoke: true
          - runner: macos-latest
            target: aarch64-apple-darwin
            smoke: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux || 'auto' }}

      # Only where the runner can install the wheel it just built.
      - name: Smoke test the wheel
        if: matrix.smoke
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/smoke/bin/fnug" --help
          "$RUNNER_TEMP/smoke/bin/python" -c "import sys, fnug; sys.exit(fnug.run('--help').returncode)"

      - uses: actions/upload-artifact@v5
        with:
          name: pypi-wheels-${{ matrix.target }}
          path: dist/*.whl

  pypi-sdist:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      # Builds outside the checkout, with the runner's default toolchain, like a user would.
      - name: Smoke test the sdist
        run: |
          python3 -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.tar.gz
          "$RUNNER_TEMP/smoke/bin/fnug" --help
          "$RUNNER_TEMP/smoke/bin/python" -c "import sys, fnug; sys.exit(fnug.run('--help').returncode)"

      - uses: actions/upload-artifact@v5
        with:
          name: pypi-sdist
          path: dist/*.tar.gz

  publish-crates:
    needs: [detect, build, pypi-build, pypi-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      # cargo publish waits for the index itself, and a failure is never skipped.
      - name: Publish the crates that crates.io doesn't have yet
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          published() {
            curl -sf "https://index.crates.io/fn/ug/$1" | jq -e --arg v "$2" 'select(.vers == $v)' > /dev/null
          }
          vt100=$(python3 -c 'import tomllib; print(tomllib.load(open("vendor/vt100/Cargo.toml", "rb"))["package"]["version"])')
          if published fnug-vt100 "$vt100"; then
            echo "fnug-vt100 $vt100 is already on crates.io"
          else
            cargo publish --manifest-path vendor/vt100/Cargo.toml
          fi
          if published fnug "$VERSION"; then
            echo "fnug $VERSION is already on crates.io"
          else
            cargo publish
          fi

  publish-pypi:
    needs: publish-crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: pypi-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  release:
    needs: [detect, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: fnug-*
          merge-multiple: true

      - name: Write checksums
        run: sha256sum fnug-* > SHA256SUMS

      - name: Tag and publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            fnug-*
            SHA256SUMS
