[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "fnug"
description = "A TUI command runner based on git changes"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
keywords = ["tui", "terminal", "git", "lint", "test-runner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/nickolaj-jepsen/fnug"
Repository = "https://github.com/nickolaj-jepsen/fnug"

[tool.maturin]
bindings = "bin"
python-source = "python"
strip = true
# The pin is for development; sdist builds use whatever toolchain the user has.
exclude = [{ path = "rust-toolchain.toml", format = "sdist" }]

[tool.ruff]
target-version = "py310"
src = ["python"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # pydocstyle — docstring style enforcement
    "COM812",  # trailing comma (conflicts with formatter)
    "ISC001",  # single-line string concat (conflicts with formatter)
    "CPY001",  # no per-file copyright headers
]

[tool.ruff.lint.per-file-ignores]
"python/fnug/__init__.py" = ["F401"]  # re-exports
"python/tests/**" = [
    "S101",    # assert is how pytest checks
    "PLR2004", # magic values in expectations
    "INP001",  # tests are not a package
    "ANN",     # fixtures and tests go unannotated
    "S603",    # subprocess calls with trusted input
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
addopts = ["--strict-markers"]
markers = ["integration: runs the real fnug binary; skipped when it is not installed"]
